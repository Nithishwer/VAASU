[project]
name = "vaasu"
version = "0.1.0"
description = "Minimal tools for setting up absolute binding free energy perturbation simulations."
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = [
    "mdrestraintsgenerator @ git+https://github.com/Nithishwer/MDRestraintsGenerator.git@49a454755b5bd3c842c83852122a43313acfcbcd",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff"]
